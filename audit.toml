# cargo-audit configuration: advisories fail the CI audit job by design.
#
# There are no `[advisories.ignore]` entries here on purpose: ignoring an advisory
# should be a deliberate, dated, reviewed change, not a default. When an advisory fires,
# either upgrade the dependency or add an ignore below with the advisory id, the reason,
# and the date it was accepted.
#
# The audit job also runs on a weekly schedule (see .github/workflows/ci.yml), so a
# newly published advisory surfaces on the scheduled run rather than reddening the next
# unrelated pull request.

[output]
# Informational warnings that fail the job too, not just vulnerabilities.
# TODO(F-S8): add "unmaintained" once askama is upgraded; today basic-toml (unmaintained,
# via askama 0.12 / askama_axum 0.4) would fail every run.
deny = ["unsound", "yanked"]
