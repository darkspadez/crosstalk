name: Build

# Static Linux binaries and the multi-arch Docker image, all on Namespace runners.
#
#   pull request -> binaries as workflow artifacts; image built but not pushed
#   push to main -> binaries as workflow artifacts; image pushed as :edge and :sha-<short>
#   every run    -> the crosstalk-bridge plugin zip as a workflow artifact
#   push v* tag  -> GitHub Release with the binaries, the bridge zip + SHA256SUMS; image pushed with
#                   semver tags, plus `latest` for non-prerelease versions. Nothing is
#                   published until CI (ci.yml) has passed on the tag's own push run
#                   (`ci-gate`); tag builds run without the Namespace cache volume, and
#                   the image, tarballs and bridge zip get signed build-provenance attestations.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    # A tag that disagrees with the workspace version would publish a binary that
    # reports the wrong `--version`: refuse it before anything is built.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      # Cargo's own view of the version (not a regex over Cargo.toml), so a moved
      # `version` key or a prerelease suffix (v1.2.0-rc.1) compares exactly.
      - name: Tag matches the workspace version
        run: |
          want="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "crosstalk") | .version')"
          got="${GITHUB_REF_NAME#v}"
          if [ "$want" != "$got" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $want"
            exit 1
          fi

  # A release must not outrun its tests: a tag push starts CI (ci.yml has `tags: ["v*"]`)
  # and this build at the same time, so wait for that CI run (same commit, push event, the
  # tag as its ref) and refuse to publish unless it succeeded. Polling keeps pull request
  # and main builds exactly as they were, which a `workflow_run` trigger would not.
  ci-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    permissions:
      actions: read
    timeout-minutes: 70
    steps:
      - name: CI passed for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&per_page=100"
          deadline=$(( $(date +%s) + 3600 ))
          while :; do
            # gh's jq reads the tag from the environment; head_branch is the tag name
            # for a tag push. The newest such run wins, so a re-run of CI counts.
            state="$(gh api "$api" --jq \
              '[.workflow_runs[] | select(.head_branch == env.GITHUB_REF_NAME)] | sort_by(.created_at) | last | if . == null then "" else "\(.status)/\(.conclusion)" end')"
            case "$state" in
              completed/success)
                echo "CI passed for $GITHUB_REF_NAME ($GITHUB_SHA)"
                exit 0 ;;
              completed/*)
                echo "::error::CI finished as ${state#completed/} for $GITHUB_REF_NAME; not publishing"
                exit 1 ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no successful CI run for $GITHUB_REF_NAME within 60 minutes (last: ${state:-none})"
              exit 1
            fi
            echo "waiting for CI on $GITHUB_REF_NAME (${state:-not started})"
            sleep 30
          done

  # THIRD_PARTY_LICENSES: the licence text of every Rust crate compiled in, generated from
  # Cargo.lock (about.toml, about.hbs), once, for both the tarballs and the image.
  licenses:
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-about
      - name: Generate THIRD_PARTY_LICENSES
        run: |
          cargo about generate -o THIRD_PARTY_LICENSES about.hbs
          test -s THIRD_PARTY_LICENSES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES
          if-no-files-found: error

  binaries:
    needs: [version, licenses]
    # `version` is skipped on non-tag runs; still build then, but never after it fails.
    if: ${{ !cancelled() && needs.version.result != 'failure' && needs.licenses.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    # Native runners for both architectures: no cross toolchain, no QEMU.
    # Cache volumes: pull requests get their own (crosstalk-pr-<arch>), so fork code (build
    # scripts, proc macros) cannot leave anything a trusted build reads back; main builds
    # keep crosstalk-<arch>; a release tag builds on a runner with no cache volume at all.
    runs-on: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && format('["nscloud-ubuntu-24.04-{0}-8x16"]', matrix.arch) || format('["nscloud-ubuntu-24.04-{0}-8x16-with-cache", "nscloud-cache-tag-crosstalk-{1}{0}"]', matrix.arch, github.event_name == 'pull_request' && 'pr-' || '')) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ring (rustls) and bundled SQLite compile C code, so the musl target needs musl-gcc.
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          cache: rust

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: third-party-licenses

      - name: Build
        run: cargo build --locked --release --bin crosstalk --target ${{ matrix.target }}

      - name: The binary is static and runs
        run: |
          bin="target/${{ matrix.target }}/release/crosstalk"
          file "$bin"
          file "$bin" | grep -qE 'static(-pie|ally) linked'
          "$bin" --version

      - name: Package
        id: pkg
        run: |
          name="crosstalk-${GITHUB_REF_NAME//\//-}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/crosstalk" README.md LICENSE \
            THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES "dist/$name/"
          cp config/*.example.toml "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crosstalk-linux-${{ matrix.arch }}
          path: dist/${{ steps.pkg.outputs.name }}.tar.gz
          if-no-files-found: error

  # The crosstalk-bridge Dispatcharr plugin (bridge/, docs/bridge.md) as the zip Dispatcharr's
  # plugin import takes: one crosstalk_bridge/ folder (the key the import derives) holding
  # plugin.json, plugin.py, README.md and LICENSE. File times are the commit's and the entries
  # are sorted, so the same commit zips to the same bytes.
  bridge:
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The plugin's tests pass
        run: python3 -I -m unittest discover -s bridge/tests -v
      - name: Package
        id: pkg
        run: |
          version="$(jq -r .version bridge/plugin.json)"
          if ! grep -qx "VERSION = \"$version\"" bridge/plugin.py; then
            echo "::error::bridge/plugin.json says $version but plugin.py's VERSION differs"
            exit 1
          fi
          name="crosstalk-bridge-$version"
          mkdir -p dist/crosstalk_bridge
          cp bridge/plugin.json bridge/plugin.py bridge/README.md LICENSE dist/crosstalk_bridge/
          stamp="$(git log -1 --format=%cd --date=format-local:%Y%m%d%H%M.%S)"
          (
            cd dist
            TZ=UTC find crosstalk_bridge -exec touch -h -t "$stamp" {} +
            find crosstalk_bridge -type f | LC_ALL=C sort | TZ=UTC zip -X -D -@ "$name.zip"
          )
          unzip -l "dist/$name.zip"
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          TZ: UTC
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crosstalk-bridge
          path: dist/${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error

  image:
    needs: [version, ci-gate, licenses]
    # On a tag, only after CI passed (ci-gate); elsewhere ci-gate is skipped.
    if: >-
      ${{ !cancelled() && needs.version.result != 'failure' && needs.licenses.result == 'success'
      && (!startsWith(github.ref, 'refs/tags/') || needs.ci-gate.result == 'success') }}
    permissions:
      contents: read
      packages: write
      # Build-provenance attestation of the pushed image (Sigstore via the OIDC token).
      id-token: write
      attestations: write
    # The build itself runs on Namespace Remote Builders, which build each platform
    # natively; the runner only drives it, so it can stay small. No setup-buildx/QEMU.
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Into the build context, where the Dockerfile copies it to /usr/share/doc/crosstalk/.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: third-party-licenses

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` only from a semver tag without a prerelease suffix.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push outside pull requests)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # A pull request builds both platforms but exports nothing: Namespace's remote
          # builders cannot export a multi-node build locally ("oci for multi-node builds
          # currently not supported"), so it only fills the cache.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || '' }}
          # A release image never reuses builder cache that pull request builds filled.
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          # Pushed images carry a full SLSA provenance and an SPDX SBOM in the registry
          # (a cache-only pull request build has nothing to attach them to).
          provenance: ${{ github.event_name == 'pull_request' && 'false' || 'mode=max' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A signed GitHub attestation for the pushed digest (gh attestation verify, README).
      - name: Attest the image
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci-gate, binaries, image, bridge]
    permissions:
      contents: write
      # Build-provenance attestations for the tarballs.
      id-token: write
      attestations: write
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: crosstalk-linux-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crosstalk-bridge
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.zip | tee SHA256SUMS

      - name: Attest the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Attest the bridge zip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
