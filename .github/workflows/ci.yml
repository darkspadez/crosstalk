name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly even without code changes, so a newly published advisory surfaces on its
    # own rather than reddening the next unrelated PR.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-tag-crosstalk-amd64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Cargo registry, git deps and target/ live on the runner's Namespace cache
      # volume, so there is no upload/download round-trip as with actions/cache.
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # One matcher in the binary: no retired plugin-profile matcher symbol links into
      # the production `crosstalk` (they stay as `--features oracle` tooling).
      - name: One matcher in the binary
        run: ./scripts/one_matcher_check.sh

      # The oracle build (`simulate-streams --oracle janitor`) must keep compiling.
      - name: Clippy (oracle build)
        run: cargo clippy --locked -p crosstalk --features oracle --all-targets -- -D warnings


  docker:
    # Namespace runners hand the build to a Remote Builder (no setup-buildx needed);
    # --load brings the result back into the runner's daemon for the smoke test.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker buildx build --load -t crosstalk:ci .
      # The shipped mechanism: docker-compose.example.yml maps the host's
      # CROSSTALK_TOKEN into the container as CROSSTALK_SERVER__TOKEN (a direct
      # figment override of server.token), with CROSSTALK_SERVER__BIND for the bind.
      # This job mirrors that exactly, so CI exercises the compose path, not a
      # parallel one.
      - name: The daemon starts and answers its health check
        run: |
          docker run -d --name crosstalk-ci -p 8730:8730 \
            -e CROSSTALK_SERVER__BIND=0.0.0.0 \
            -e CROSSTALK_SERVER__TOKEN=ci-token \
            -e CROSSTALK_DISPATCHARR_API_KEY=unused \
            crosstalk:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8730/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8730/health
          # And it refuses an anonymous API call.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8730/api/v1/apps)" = "401"
          # While the compose-style token authenticates a bearer call.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://localhost:8730/api/v1/apps)" = "200"
          docker rm -f crosstalk-ci
      # The token_env indirection (server.token_env, default CROSSTALK_TOKEN) must keep
      # working too: operators who set the token in the container directly rely on it.
      - name: The token_env indirection also authenticates
        run: |
          docker run -d --name crosstalk-ci-env -p 8730:8730 \
            -e CROSSTALK_SERVER__BIND=0.0.0.0 \
            -e CROSSTALK_TOKEN=ci-token \
            -e CROSSTALK_DISPATCHARR_API_KEY=unused \
            crosstalk:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8730/health >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer ci-token' http://localhost:8730/api/v1/apps)" = "200"
          docker rm -f crosstalk-ci-env

  audit:
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails by design when an advisory matches the tree: see audit.toml (comment-only,
      # no ignores) at the repo root. The weekly schedule above means a new advisory
      # fails the scheduled run first, not an unrelated PR.
      - name: Known vulnerabilities in the dependency tree
        run: cargo audit

  parity:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-8x16-with-cache
      - nscloud-cache-tag-crosstalk-amd64
    needs: check
    timeout-minutes: 20
    # The Python plugins are pinned submodules, so every reference is always present.
    # Full history (not a shallow fetch): scripts/upstream_drift.sh compares each pin
    # against its upstream tip, which needs the commits between them.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Phase 3 step 4: data/merged/ and docs/data-merge-report.md are generated,
      # never hand-edited. Rebuilding them must reproduce every byte; a failure
      # means someone edited the output instead of the plugins or the script.
      # Well under a minute. The script refuses to run without -I.
      # Needs the reference/ submodules checked out (this job's checkout does).
      - name: Merged data set reproduces byte for byte
        run: python3 -I scripts/data/build_merged.py --check
      # The Janitor ORACLE (`--features oracle`, `simulate-streams --oracle janitor`)
      # must stay byte-identical to the Python tool: a gate. The production simulator
      # runs the unified engine; its difference from the tool is the script's
      # `[unified]` report line. Step 9: streams runs the unified engine too, so
      # `match_parity.py` and `visibility_parity.py` below are reports.
      - name: Simulate oracle vs the Python tool
        run: ./scripts/sim_parity.sh --quick
      - name: Primitive sweep vs the Python matcher
        run: |
          python3 scripts/parity_sweep.py --kinds normalize,callsign,location,network --limit 300
          python3 scripts/parity_sweep.py --kinds match,score --limit 300 --pool 60 --report
      # Phase 3 step 8: the guide oracle diff report (docs/oracle-reports/guide.md) is
      # generated, and --check verifies it reproduces byte for byte. The report itself
      # never fails on differences (reports are not gates); the corpus/consistency gates
      # below are the gate.
      - name: Guide oracle diff report reproduces
        run: python3 -I scripts/oracle_report_guide.py --check
      # Stream-Mapparr is the same engine under different flags, so it keeps its own sweep
      # against its own fuzzy_matcher.py and country.py. The first run covers the
      # adversarial corpus (zones, designators, alias folding, Unicode); the second walks
      # real database names for the callsign ladder and zone/country detection, which is
      # where its divergence from EPG Janitor shows. Both stay well under a minute.
      - name: Stream-Mapparr sweep vs its own matcher
        run: |
          python3 -I scripts/parity_sweep_sm.py --limit 300
          python3 -I scripts/parity_sweep_sm.py --kinds callsign,zone,country --limit 3000
      # Corpus oracles (phase 3 step 3): each plugin's OWN matcher behind one API
      # (scripts/corpus/oracles.py), with the disagreement reporter step 5 builds
      # the disputed set from. Hard gate, not informational: a broken oracle would
      # silently empty the disputed set, so this MUST fail the job. Well under a
      # minute. -I keeps each oracle's plugin import isolated (see oracles.py).
      - name: Corpus oracles load and answer known cases
        run: python3 -I scripts/corpus/disagreements.py --self-test
      # Phase 3 step 5: the labelled corpus and the decisions table are generated,
      # never hand-edited. Both --check runs rebuild from the pinned plugins and
      # data/merged/ and byte-compare the COMMITTED outputs (timings excluded), so
      # a stale corpus or a hand-edited decision fails here. The ablation
      # self-test first proves every source-patch anchor still applies to the
      # pinned plugins. About 3 minutes together (the ablation is most of it).
      - name: Corpus and decisions reproduce byte for byte
        run: |
          python3 -I scripts/corpus/ablate.py --self-test
          python3 -I scripts/corpus/build.py --check
          python3 -I scripts/corpus/decide.py --check
      # Phase 3 step 6: the unified Rust engine reproduces the decided Python
      # configuration pair by pair (normalize keys, callsigns, alias hits, same
      # verdicts, family membership/scores) and scores the decided construction
      # cost. Subset here (the full 28k-pair run is minutes); the full gate runs
      # on the phase branch before merge. -I for the same oracle isolation.
      - name: Unified engine vs the decided configuration (subset)
        run: python3 -I scripts/corpus/engine_parity.py --limit 300 --jobs 4
      # Channel operations replace the plugin's five cleanup actions, so their selection and
      # payload logic is compared against the plugin's own code. -I keeps the harness from
      # importing anything outside the plugin checkout (which it puts on sys.path itself).
      - name: Channel ops vs the plugin's cleanup actions
        run: python3 -I scripts/channel_ops_parity.py
      # The streams sort is Stream-Mapparr's quality model, ported. The harness drives the
      # plugin's REAL `_sort_streams_by_quality` / `_zone_routed_map` (with the Django stubs the
      # plugin's own tests install) and compares the per-channel orders with
      # `crates/streams/examples/sort_io`. ~10s over 840 cases, 1500 channels.
      - name: Streams sort vs the plugin's quality model
        run: python3 -I scripts/sort_parity.py
      # Phase 3 step 9: streams runs the unified matching layer, so the plugin's
      # collector is an oracle, not a gate. The harness drives the plugin's REAL
      # `_build_channel_groups`, `_match_streams_to_channel`,
      # `_channels_to_update_for_group`, `_streams_to_assign`, `_same_country_ids_for` and
      # `_write_channel_streams` (with the Django stubs its own tests install, plus a fake
      # ChannelStream table) and compares every channel's final stream list with
      # `crates/streams/examples/match_io` in report mode (exit 0; diffs are attributed
      # in `docs/oracle-reports/streams.md`). ~20s over 1,800 swept cases plus
      # randomised ones, EPG placeholder fixtures included.
      - name: Streams match vs the plugin's collector (report)
        run: python3 -I scripts/match_parity.py --report
      # The three read-only streams tools, against the plugin's own code: its
      # `check_stream_countries_action` and `test_regex_rules_action` driven end to end, and
      # `placeholder_scan.py` imported directly (it is plain Python). The EPG placeholder path
      # is part of the match step above, with the two ORM lookups stubbed to fixtures.
      - name: Streams read-only tools vs the plugin's own code
        run: python3 -I scripts/tools_parity.py
      # The mirror fill is Stream-Mapparr's Fill Mirror Backups, ported: server-group accounts,
      # the provider-id index, the active/host rules, the insert position before trailing
      # custom streams and the readout's counts. The harness drives the plugin's REAL
      # `fill_mirror_backups_action` (with M3UAccount/ChannelStream/Stream faked the way the
      # plugin's own tests fake them) and compares the written orders with
      # `crates/streams/examples/mirror_io`.
      - name: Streams mirror fill vs the plugin's own action
        run: python3 -I scripts/mirror_parity.py
      # The probe is IPTV Checker's stream check, ported. The harness replays outputs recorded
      # from the REAL ffprobe/ffmpeg (crates/streams/tests/fixtures/probe/corpus.json, made by
      # scripts/probe_fixtures.py) through the plugin's own `check_stream`, `_analyze_stream_content`
      # and `_channels_where`, and compares the command lines, the parse, the classification, the
      # stats merge and the per-channel verdicts with `crates/streams/examples/probe_io`.
      - name: Streams probe vs the plugin's stream check
        run: python3 -I scripts/probe_parity.py
      # Phase 3 step 9: match and visibility group by the same identity family key, so
      # the plugin's visibility action is an oracle, not a gate. The harness drives the
      # plugin's REAL `manage_channel_visibility_action` (with `ChannelProfileMembership`
      # faked as a table) plus the shared grouping, and compares the resulting
      # membership per channel with `crates/streams/examples/visibility_io` in report
      # mode (exit 0; diffs are attributed in `docs/oracle-reports/streams.md`).
      - name: Streams visibility vs the plugin's own action (report)
        run: python3 -I scripts/visibility_parity.py --report
      # Phase 3 step 9: the streams oracle diff report (docs/oracle-reports/streams.md)
      # is generated, and --check verifies it reproduces byte for byte. The report
      # itself never fails on differences (reports are not gates); the corpus and
      # cross-app consistency gates are the gate.
      - name: Streams oracle diff report reproduces
        run: python3 -I scripts/oracle_report_streams.py --check
      # Triage and restore are IPTV Checker's seven post-actions and its Restore Recovered
      # Channels, ported. The harness runs the plugin's REAL rename/move/suffix actions in its
      # own scheduled order (with the channel table faked as a dict and the real
      # `_capture_original_state` writing a state file), then its `restore_channels_action` with
      # that state file built from the same recorded changes, and compares every channel's final
      # name and group with `crates/streams/examples/triage_io`. Two shapes are counted rather
      # than failed — the plugin's repeated tag and a quality tag it strips that crosstalk never
      # recorded — and both are documented divergences.
      - name: Streams triage and restore vs the plugin's own actions
        run: python3 -I scripts/triage_parity.py
      # Phase 3 step 13: the lineup loader is Lineuparr's `_load_lineup` pipeline,
      # ported entry for entry (CC_ prefix rewrite, entry/category/filename country,
      # detail folding, group names, numbers). The harness drives the plugin's REAL
      # methods over all 29 files x 4 detail modes x 4 group prefixes (464 cases) and
      # compares each entry with `crates/lineup/examples/lineup_dump`. A gate.
      - name: Lineup files vs Lineuparr's own loader
        run: python3 -I scripts/lineup_file_parity.py
      # Phase 3 step 14: the clean pipeline is Channel Name Cleaner's fixed rule
      # order, protect list, scope and collision strategies, ported onto the unified
      # tags and the shared resolver. The harness drives the plugin's REAL
      # `_compute_changes` (Django stubbed, channel table faked) over lineup names,
      # merged DB names, corpus provider variants, NC test-like cases and collision
      # scenarios x 9 settings/scope variants and compares every row (status, final
      # name, rules, removed quality) with `crates/lineup/examples/clean_dump`. A
      # gate: the corpus keeps existing names unique so the run measures the
      # pipeline, not the two documented divergences (wildcard unified scope; the
      # shared resolver's counted-slot/`skip`-cascade collision fixes, pinned by
      # Rust unit tests instead).
      - name: Lineup clean vs Name Cleaner's own pipeline
        run: python3 -I scripts/clean_parity.py
      # Informational, never failing: what upstream changed since each pinned reference
      # commit in the files crosstalk ports from it. Covers every reference submodule
      # (EPG Janitor, Stream-Mapparr, IPTV Checker, Channel-Mapparr, Lineuparr, Channel
      # Name Cleaner), each with its own ported-file list.
      # The weekly schedule is what makes it a reminder; the script itself exits 0
      # whatever it finds (see plans/plugin-consolidation.md).
      - name: Upstream drift since each reference pin
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./scripts/upstream_drift.sh
