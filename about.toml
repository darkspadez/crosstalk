# cargo-about configuration: `cargo about generate about.hbs` writes THIRD_PARTY_LICENSES
# (build.yml), the full licence text of every Rust crate compiled into the binary. It ships
# in the release tarball and in the image under /usr/share/doc/crosstalk/.
#
# `accepted` is the same allow-list as deny.toml's [licenses] allow: change both together.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
# The two release targets; dev-dependencies never ship.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-dev-dependencies = true
# ring's licence file predates SPDX metadata; cargo-about's built-in clarification.
workarounds = ["ring"]
