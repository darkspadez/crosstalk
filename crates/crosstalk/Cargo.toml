[package]
name = "crosstalk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Host daemon for Dispatcharr tools, with guide as its first sub-app"

[[bin]]
name = "crosstalk"
path = "src/main.rs"

[dependencies]
crosstalk-core.workspace = true
crosstalk-matching.workspace = true
crosstalk-web.workspace = true
crosstalk-guide.workspace = true
crosstalk-streams.workspace = true
crosstalk-lineup.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
csv.workspace = true
chrono.workspace = true
fancy-regex.workspace = true
rayon.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true

[features]
# Oracle tooling: `simulate-streams --oracle janitor`, the retired EPG Janitor pipeline
# ported from `tools/match_sim.py`, which `scripts/sim_parity.sh` pins against the
# Python tool. A production build has one matcher: the unified engine.
oracle = []

[dev-dependencies]
tempfile.workspace = true
