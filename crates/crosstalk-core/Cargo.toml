[package]
name = "crosstalk-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Host services shared by every crosstalk sub-app"

[dependencies]
crosstalk-matching.workspace = true

anyhow.workspace = true
async-trait = { workspace = true }
rayon.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
figment.workspace = true
tokio.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
dashmap.workspace = true
csv.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tracing.workspace = true
tokio-cron-scheduler.workspace = true
croner.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
proptest.workspace = true
# `test-util` gives the tests a paused clock: the limiter's spacing and rate limits are
# measured in seconds and minutes, and a test that really slept would be slow or flaky.
tokio = { workspace = true, features = ["test-util"] }

# The corpus labeller's tests (fake provider, settled-probability rule) run with
# `cargo test --workspace`; examples are only built, not tested, by default.
[[example]]
name = "label_pair"
test = true
