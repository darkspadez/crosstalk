# crosstalk host configuration.
#
# This file holds everything the host owns: the Dispatcharr connection, the AI providers,
# the HTTP listener, the thread pool, the schedule list, and every option the sub-apps must
# agree on -- the shared name-matching options, the channel scope, the CSV retention and the
# AI matching policy. Each sub-app has its own file next to this one (guide.toml, ...) for
# the thresholds and filters that are genuinely its own.
#
# Every value can be overridden by an environment variable named CROSSTALK_<SECTION>__<KEY>
# in upper case, for example CROSSTALK_SERVER__PORT=9100 or CROSSTALK_SCOPE__PROFILES="All".
# A double underscore separates levels, which is how one value is changed in a container
# without editing this file.
#
# Copy this file to crosstalk.toml and edit it. The daemon writes back to that file when a
# setting is changed in the web UI, and it preserves comments when it does.

[server]
# Interface to listen on. Keep the loopback default unless something in front of it
# authenticates requests.
bind = "127.0.0.1"
port = 8730
# Bearer token required on every request. Leave empty only while `bind` is loopback.
# Prefer the environment variable named by `token_env` so the secret stays out of the file.
token = ""
token_env = "CROSSTALK_TOKEN"

[dispatcharr]
# Dispatcharr's base URL, without the /api suffix.
base_url = "http://localhost:9191"
# An API key is preferred: it does not expire, so a long-running schedule never has to
# re-authenticate. Sent as the X-API-Key header.
api_key = ""
api_key_env = "CROSSTALK_DISPATCHARR_API_KEY"
# JWT fallback, used only when no API key resolves.
username = ""
password = ""
password_env = "CROSSTALK_DISPATCHARR_PASSWORD"
# Per-request timeout in seconds.
timeout_secs = 30
# Cap on concurrent requests. The public TypeSafe endpoint rate-limits around eight
# concurrent requests; Dispatcharr itself is usually fine with more.
concurrency = 8

# AI providers. The endpoint, the key and the concurrency cap live here, so several
# sub-apps share one provider entry rather than each holding a copy. Which provider and
# model are used, and when a borderline match is worth asking about, is the [ai.verify]
# policy below.
#
# [ai.providers.typesafe]
# kind = "typesafe"            # native System One: real probabilities and confidence
# base_url = "https://api.typesafe.ai/v1"
# api_key = ""
# api_key_env = "TYPESAFE_API_KEY"
# timeout_secs = 30
# max_concurrency = 8
#
# [ai.providers.local]
# kind = "openai_compat"       # any OpenAI-compatible chat endpoint
# base_url = "http://localhost:11434/v1"
# api_key_env = "OPENAI_API_KEY"
# max_concurrency = 4

# The AI matching policy. The heuristics decide first and the model only promotes: it is
# asked about results in the band below, or about candidates for a channel the heuristics
# could not match at all. A heuristic result at or above a sub-app's own confidence
# threshold is never re-checked or vetoed by the model. An AI-accepted pick is still
# validated for programme data: when every same-name copy is empty the channel is left
# unmatched with a reason saying so. The guide app's heal never consults the model.
#
# The provider name below must match an [ai.providers.<name>] entry.
[ai.verify]
enabled = false
provider = "typesafe"
# Model name as the provider spells it. TypeSafe's aliases are jev-latest and jev-preview;
# pinning a version (jev-1.14.0) keeps answers stable when a new release ships.
model = "jev-latest"
# Inclusive score band treated as uncertain.
verify_band_low = 80
verify_band_high = 94
# Offer the model a shortlist when the heuristics found nothing above the floor.
rescue = true
rescue_floor = 60
# Candidates per request. More costs tokens; the request is one call regardless.
shortlist = 5
# A candidate is accepted when the model's yes-probability reaches this and its choice
# agrees. At or below reject_threshold it is dropped outright. Between the two, the channel
# is left unmatched and the row says "AI undecided".
accept_threshold = 0.8
reject_threshold = 0.3
# Below this, the model's pick is treated as undecided.
min_confidence = 0.5

# Which channels a run may touch, shared by every sub-app: "which channels am I responsible
# for" is the same question for all of them, and answering it twice lets two apps disagree
# about one install. An app's own filters (the guide's EPG sources, for example) stay in
# that app's file.
[scope]
# Comma-separated profile names. Empty means every profile for the scope filter. The guide's
# 'Clear EPG from Hidden Channels' refuses to run without one, and uses every name given.
profiles = ""
# Only process channels in these groups. Supports * and ? wildcards. Cannot be combined
# with ignore_groups: set one or the other. The guide's 'Clear ALL EPG in Groups' also takes
# its channel set from here, and refuses to run while this is empty.
groups = ""
# Exclude channels in these groups, applied after `groups`.
ignore_groups = ""

# CSV reports, in the shared exports directory. Only files named <app>_*.csv are touched.
[exports]
# Delete this app's CSV exports older than this many days. 0 keeps everything.
retention_days = 0

[matching]
# The ONE decision cut every app matches at (guide assigns, streams attaches, lineup
# names): a sensitivity preset -- strict/high/medium/low (95/90/80/70) -- or a bare
# number. Guide's old per-action thresholds are retired in favour of this.
sensitivity = "strict"
# These four toggles live here rather than in a sub-app file, because every sub-app that
# compares channel names must agree on them: two apps disagreeing about whether "[HD]" is
# stripped would give two different answers for the same channel.
ignore_quality_tags = true
ignore_regional_tags = true
ignore_geographic_tags = true
ignore_misc_tags = true

# Which shipped channel databases the matcher may draw reference names from. Empty means
# the plugin's rule: every database when only one ships, otherwise the United States one.
# Enabling a country you do not carry costs accuracy rather than gaining coverage.
enabled_databases = ["US"]

# Custom aliases, merged over the built-in table. An entry REPLACES the built-in list for
# that key rather than adding to it, so include the built-in variants you still want.
# [matching.custom_aliases]
# "FOX News Channel" = ["FOX NEWS HD", "FoxNews"]

[jobs]
# Worker threads for the matching stage. 0 means one per core.
worker_threads = 0
# Relative paths resolve against this file's directory.
exports_dir = "exports"
data_dir = "data"
# Days of run history kept in the SQLite store. Pruned after each run finishes,
# keeping at least the 10 newest runs per app. 0 keeps everything.
run_history_days = 15

# Schedules, as `<app>.<action>` with a cron expression. Five fields (minute hour day month
# weekday) is what most people write, and six (with seconds) is accepted. They fire in UTC.
# [schedules]
# A plain expression is a run with no deadline. A table adds a window: the run stops at the
# window's end, is recorded "paused", and the next firing resumes from its checkpoint.
#   "streams.probe" = { cron = "0 23 * * *", window = "4h" }
#   "streams.probe_weekend" = { cron = "0 22 * * 5", until = "06:00", timezone = "America/New_York" }
# "guide.watchdog_apply" = "0 */6 * * *"
# "guide.scan" = "30 */6 * * *"
# "guide.match_apply" = "0 4 * * *"
# "guide.heal_apply" = "0 6 * * *"

# Named workflows: a sequence of `<app>.<action>` steps the host runs in order, each as an
# ordinary run of its own (own run page, own CSV, own checkpoint), plus one run record for the
# workflow itself that links them. It stops at the first step that fails (unless that step sets
# continue_on_failure, below) or is cancelled; a step
# that pauses at its window's end pauses the workflow, and the next firing resumes that step.
# Schedule one as "workflow.<name>", like an action.
# [workflows.nightly]
# steps = ["streams.probe", "streams.sort_apply"]
# A new pass discards each step's saved progress. Off by default, which resumes instead: what
# an operator turns on after widening the scope.
# fresh = false
#
# A step can also be a table: `scope` REPLACES [scope] for that step (a table, or the name of
# a scope an app provides, like "lineup" — which may reach channels [scope] excludes), and
# `continue_on_failure` carries on past that step's failure (the workflow still ends failed).
# A step's scope only ever comes from this file: hooks and the UI cannot pass one. TOML does
# not allow a line break inside `{ ... }`, so keep each table on one line, or use
# [[workflows.<name>.steps]] tables instead.
# [workflows.full_sync]
# steps = [
#   "lineup.sync_apply",
#   { action = "streams.match_apply", scope = "lineup" },
#   { action = "guide.match_apply", scope = { groups = "DIRECTV: *" }, continue_on_failure = true },
# ]

# Dispatcharr Connect events, and what they trigger. A target is an `<app>.<action>` or a
# `workflow.<name>`; the event names are whatever you subscribe to in Dispatcharr
# (m3u_refresh, epg_refresh, m3u_error, …), so unknown names are allowed.
#
# Setup, in Dispatcharr: Settings → Connect → Add Connection, type Webhook, URL
# `http://<crosstalk host>:8730/hooks/dispatcharr` (crosstalk's own `server.port`, which
# defaults to 8730 — not Dispatcharr's port), header `Authorization: Bearer <server.token>`
# (and `Content-Type: application/json` if you use a payload template), then subscribe the
# events below. Dispatcharr's own payload carries no event name, so either add `?event=<name>`
# to the URL or give the subscription a payload template like {"event": "m3u_refresh"}.
#
# A burst of the same event (several M3U accounts refreshing together) restarts the debounce
# timer and results in ONE run after the burst settles. If the target is busy, one follow-up run
# is queued for when it frees.
# [hooks]
# debounce_secs = 60
# rate_per_minute = 60
# m3u_refresh = ["streams.match_apply"]
# epg_refresh = ["workflow.nightly"]
