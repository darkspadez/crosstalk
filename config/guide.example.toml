# Guide settings.
#
# This file holds what the guide app decides for itself: which channels and EPG sources are in
# scope, the confidence thresholds, and how the AI verifier behaves. Anything shared with
# other sub-apps (normalisation toggles, country databases, aliases) is in crosstalk.toml.
#
# The daemon writes back to this file when a setting is changed in the web UI, preserving
# comments. The matcher's own defaults are the Python plugin's.

# Comma-separated channel profile names to scope to. Empty means every profile.
channel_profile_name = ""
# Only process channels in these groups. Supports * and ? wildcards. Cannot be combined
# with ignore_groups: set one or the other.
selected_groups = ""
# Exclude channels in these groups, applied after selected_groups.
ignore_groups = ""
# Comma-separated EPG source names to draw candidates from, a filter rather than a priority
# list. Supports * and ? wildcards. Priority comes from each source's Dispatcharr priority,
# and disabled sources are skipped. Empty makes every active source eligible, foreign
# guides included, and the matcher has no country awareness: scope this to your region.
epg_sources_to_match = ""
# How far ahead programme data must exist for a match to count.
check_hours = 12

# 0-100. Matches below this are rejected. 95 is strict; lower values accept more matches at
# higher false-positive risk.
match_confidence_threshold = 95
# Accept an EPG entry with no current schedule. Usually off, but needed for the first
# auto-match against a freshly added source: Dispatcharr only imports programmes for
# channels already mapped, so a new source starts empty.
allow_epg_without_programs = false

# Sources heal may pick replacements from. Empty means the channel's current source only.
heal_fallback_sources = ""
heal_confidence_threshold = 95

# Delete this app's CSV exports older than this many days. 0 keeps everything.
csv_retention_days = 0

# The heuristics decide first and the model only promotes. It is asked about results in
# the band below, or about candidates for a channel the heuristics could not match at
# all. A heuristic result at or above match_confidence_threshold is never re-checked
# or vetoed by the model. An AI-accepted pick is still validated for programme data:
# when every same-name copy is empty the channel is left unmatched with a reason saying
# so. Heal never consults the model.
#
# The endpoint and key are NOT here: they belong to the host. Pick a provider name from
# [ai.providers] in crosstalk.toml.
[ai]
enabled = false
provider = "typesafe"
# Model name as the provider spells it. TypeSafe's aliases are jev-latest and jev-preview;
# pinning a version (jev-1.14.0) keeps answers stable when a new release ships.
model = "jev-latest"
# Inclusive score band treated as uncertain.
verify_band_low = 80
verify_band_high = 94
# Offer the model a shortlist when the heuristics found nothing above the floor.
rescue = true
rescue_floor = 60
# Candidates per request. More costs tokens; the request is one call regardless.
shortlist = 5
# A candidate is accepted when the model's yes-probability reaches this and its choice
# agrees. At or below reject_threshold it is dropped outright. Between the two, the channel
# is left unmatched and the row says "AI undecided".
accept_threshold = 0.8
reject_threshold = 0.3
# Below this, the model's pick is treated as undecided.
min_confidence = 0.5
