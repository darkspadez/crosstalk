# crosstalk next to Dispatcharr.
#
#   1. copy this file to docker-compose.yml
#   2. copy config/*.example.toml into ./config/ and rename them
#   3. generate a token (openssl rand -hex 24), set it below, and set your Dispatcharr API key
#   4. docker compose up -d --build
#
# The container listens on 0.0.0.0 (set below), so a token is mandatory: the daemon refuses to
# start on a non-loopback address without one. The host side publishes on 127.0.0.1 only:
# put a reverse proxy (TLS) in front for remote access rather than exposing the port.
services:
  crosstalk:
    build:
      context: .
      args:
        # Make the container user match whoever owns ./config, so the daemon can write its
        # database, CSV exports and settings changes. On Linux this matters; on Docker Desktop
        # the bind mount is remapped for you.
        PUID: "${PUID:-1000}"
        PGID: "${PGID:-1000}"
    image: crosstalk:latest
    container_name: crosstalk
    restart: unless-stopped
    # Longer than the daemon's 30s run drain: Docker's default 10s kill would SIGKILL an
    # apply mid-`batch_set_epg` instead of letting it finish or cancel cleanly.
    stop_grace_period: 40s
    # Mirrors the image HEALTHCHECK (which assumes the default server.port of 8730).
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8730/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # Loopback only. A reverse proxy on the host (Caddy, nginx, Traefik) terminates TLS and
      # forwards here; list its address in [server] trusted_proxies. If the proxy runs in
      # another container on the same network, drop `ports:` and point it at crosstalk:8730.
      - "127.0.0.1:8730:8730"
    volumes:
      - ./config:/config
    # Least privilege: the daemon writes only /config (the bind mount above) and /tmp, needs
    # no Linux capabilities (unprivileged user, port above 1024) and never escalates.
    # CI's docker smoke test runs the image with the same flags.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    environment:
      # Bind inside the container. Without this the daemon listens on the container's loopback
      # and the published port cannot reach it.
      CROSSTALK_SERVER__BIND: "0.0.0.0"
      CROSSTALK_SERVER__TOKEN: "${CROSSTALK_TOKEN:?set CROSSTALK_TOKEN to a long random string}"
      # Dispatcharr's API key, from its own UI. Preferred over a username and password because
      # it does not expire.
      CROSSTALK_DISPATCHARR_API_KEY: "${DISPATCHARR_API_KEY:?set DISPATCHARR_API_KEY}"
      # [dispatcharr] base_url also comes from the config file; override it here instead if you
      # prefer to keep everything in the environment:
      # CROSSTALK_DISPATCHARR__BASE_URL: "http://dispatcharr:9191"
      # TypeSafe, for AI verification. Leave it unset to match purely heuristically.
      # TYPESAFE_API_KEY: ""
      RUST_LOG: "info"
    # On the same compose network as Dispatcharr, so [dispatcharr] base_url can be
    # "http://dispatcharr:9191".
    # depends_on:
    #   - dispatcharr
